{% extends "base.html" %}

{% block title %}登录 - Web Blog{% endblock %}

{% block content %}
  <section class="form-shell narrow" id="login-form">
    <p class="eyebrow">Account</p>
    <h1>登录</h1>
    <form method="post" @submit="handleSubmit">
      <div class="field">
        <label for="username">用户名</label>
        <input
          id="username"
          name="username"
          type="text"
          v-model.trim="username"
          autocomplete="username"
          required
        >
        <p class="hint" :class="{ error: usernameError }" v-text="usernameHint"></p>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input
          id="password"
          name="password"
          type="password"
          v-model="password"
          autocomplete="current-password"
          required
        >
        <p class="hint" :class="{ error: passwordError }" v-text="passwordHint"></p>
      </div>

      <button class="button full" type="submit" :disabled="!canSubmit">登录</button>
    </form>
    <p class="auth-switch">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
  </section>
{% endblock %}

{% block scripts %}
  <script>
    Vue.createApp({
      data() {
        return {
          username: "",
          password: "",
          submitted: false
        };
      },
      computed: {
        usernameError() {
          return this.submitted && this.username.length === 0;
        },
        passwordError() {
          return this.submitted && this.password.length === 0;
        },
        usernameHint() {
          return this.usernameError ? "请输入用户名" : " ";
        },
        passwordHint() {
          return this.passwordError ? "请输入密码" : " ";
        },
        canSubmit() {
          return this.username.length > 0 && this.password.length > 0;
        }
      },
      methods: {
        handleSubmit(event) {
          this.submitted = true;
          if (!this.canSubmit) {
            event.preventDefault();
          }
        }
      }
    }).mount("#login-form");
  </script>
{% endblock %}
